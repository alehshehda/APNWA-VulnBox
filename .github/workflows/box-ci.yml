name: Validate Box Configs and Services

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'box/**'
      - '.github/workflows/box-ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'box/**'
      - '.github/workflows/box-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint_box:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck php-cli python3-flask yamllint sudo

      - name: Lint shell scripts with shellcheck
        run: |
          shellcheck box/scripts/*.sh box/configs/*.sh box/src/admin/*.sh box/src/admin/hooks/*.sh

      - name: Compile-check Python modules
        run: |
          python3 -m py_compile box/src/internal_api/app.py box/src/admin/maintenance.py box/src/admin/status_helper.py

      - name: Syntax-check PHP application
        run: |
          php -l box/src/web/index.php

      - name: Validate Netplan YAML syntax
        run: |
          yamllint -d relaxed box/configs/01-netcfg.yaml

      - name: Validate sudoers policy syntax
        run: |
          sudo visudo -cf box/configs/90-dev-admin.sudoers

  e2e_services:
    needs: lint_box
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install service runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-flask php-cli curl

      - name: Run E2E HTTP probes against Flask and PHP services
        run: |
          set -euo pipefail
          sudo mkdir -p /var/log/webapp
          export VULNBOX_CONFIG="$PWD/box/src/internal_api/config.ini"
          export VULNBOX_AUTH_KEYS_FILE="/tmp/vulnbox_ci_authorized_keys"
          rm -f "$VULNBOX_AUTH_KEYS_FILE"
          python3 box/src/internal_api/app.py >/tmp/flask.log 2>&1 &
          FLASK_PID=$!
          php -S 127.0.0.1:8080 -t box/src/web >/tmp/php.log 2>&1 &
          PHP_PID=$!
          trap 'STATUS=$?; if [ "$STATUS" -ne 0 ]; then echo "--- flask.log ---"; cat /tmp/flask.log || true; echo "--- php.log ---"; cat /tmp/php.log || true; fi; kill "$FLASK_PID" "$PHP_PID" 2>/dev/null || true; sudo rmdir /var/log/webapp 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" -eq 1

          # Stage 2: Health, single-pass ../ rejection (404), and ....// traversal bypass (CWE-22)
          curl -fsS http://127.0.0.1:5000/health | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['status'] == 'ok'"
          curl -fsS "http://127.0.0.1:8080/?module=status" | grep -q 'VulnBox'
          HTTP_404=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/?log=../../../${PWD#/}/box/src/internal_api/config.ini")
          test "$HTTP_404" -eq 404
          TOKEN=$(curl -fsS "http://127.0.0.1:8080/?log=....//....//....//${PWD#/}/box/src/internal_api/config.ini" | awk -F'=' '/^api_token[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}')
          test -n "$TOKEN"

          # Stage 3: Auth rejection without/with wrong token (CWE-798) and proxy bridge SSH key write
          HTTP_403=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/v1/info)
          test "$HTTP_403" -eq 403
          curl -fsS "http://127.0.0.1:8080/?proxy_path=/api/v1/info&token=wrong" | grep -q 'Unauthorized'
          curl -fsS "http://127.0.0.1:8080/?proxy_path=/api/v1/info&token=${TOKEN}" | grep -q 'vulnbox-internal-api'
          curl -fsS -X POST "http://127.0.0.1:8080/?proxy_path=/api/v1/ssh-key&token=${TOKEN}" \
            --data-urlencode "ssh_key=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestKey lab@vulnbox" | grep -q 'registered'
          grep -q 'AAAAC3NzaC1lZDI1NTE5AAAAITestKey' "$VULNBOX_AUTH_KEYS_FILE"

          # Stage 5: PYTHONPATH module hijack (CWE-427) and cron backup runner check
          python3 box/src/admin/maintenance.py | grep -q 'VulnBox'
          TMP_PY_PROBE="$(mktemp -d)"
          printf 'def collect_system_summary():\n    return {"probe": "pythonpath_override"}\n' > "${TMP_PY_PROBE}/status_helper.py"
          PYTHONPATH="${TMP_PY_PROBE}" python3 box/src/admin/maintenance.py | grep -q 'pythonpath_override'
          rm -rf "${TMP_PY_PROBE}"
          bash box/src/admin/backup_check.sh
