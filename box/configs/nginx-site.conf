server {
    listen 0.0.0.0:8080 default_server;
    server_name vulnbox _;

    root /var/www/vulnbox-panel;
    index index.php index.html;

    access_log /var/log/nginx/vulnbox-access.log;
    error_log  /var/log/nginx/vulnbox-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
